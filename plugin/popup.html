<!DOCTYPE html>
<html>
<head>
    <title>Daily Copilot</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>Daily Copilot</h1>
            <div class="subtitle">AI生产力助手</div>
        </div>

        <!-- 导航标签 -->
        <div class="nav-tabs">
            <button class="nav-tab active" data-tab="chat">💬 聊天</button>
            <button class="nav-tab" data-tab="translate">🌐 翻译</button>
            <button class="nav-tab" data-tab="tools">🛠️ 工具</button>
            <button class="nav-tab" data-tab="settings">⚙️ 设置</button>
        </div>

        <!-- 内容区域 -->
        <div class="content">
            <!-- 聊天标签页 -->
            <div id="chat-tab" class="tab-content active">
                <div class="form-group">
                    <label class="form-label">选择AI模型</label>
                    <select id="chat-model" class="form-select">
                        <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                        <option value="gpt-4">GPT-4</option>
                        <option value="claude-3-sonnet">Claude 3 Sonnet</option>
                        <option value="gemini-pro">Gemini Pro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">消息</label>
                    <textarea id="chat-input" class="form-textarea" rows="4" placeholder="输入你的问题或需求..."></textarea>
                </div>
                <button id="chat-send" class="btn btn-primary">发送消息</button>
                <div id="chat-result" class="result-area"></div>
            </div>

            <!-- 翻译标签页 -->
            <div id="translate-tab" class="tab-content">
                <div class="form-group">
                    <label class="form-label">要翻译的文本</label>
                    <textarea id="text-to-translate" class="form-textarea" rows="4" placeholder="输入要翻译的文本..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">目标语言</label>
                    <select id="target-language" class="form-select">
                        <option value="英语">英语</option>
                        <option value="中文">中文</option>
                        <option value="日语">日语</option>
                        <option value="韩语">韩语</option>
                        <option value="法语">法语</option>
                        <option value="德语">德语</option>
                        <option value="西班牙语">西班牙语</option>
                        <option value="俄语">俄语</option>
                    </select>
                </div>
                <button id="translate-button" class="btn btn-primary">翻译</button>
                <div id="translation-result" class="result-area"></div>
            </div>

            <!-- 工具标签页 -->
            <div id="tools-tab" class="tab-content">
                <div class="form-group">
                    <label class="form-label">选择工具</label>
                    <div class="tools-grid">
                        <div class="tool-card" data-tool="code">
                            <div class="tool-icon">💻</div>
                            <div class="tool-name">代码生成</div>
                        </div>
                        <div class="tool-card" data-tool="search">
                            <div class="tool-icon">🔍</div>
                            <div class="tool-name">智能搜索</div>
                        </div>
                        <div class="tool-card" data-tool="document">
                            <div class="tool-icon">📄</div>
                            <div class="tool-name">文档分析</div>
                        </div>
                        <div class="tool-card" data-tool="data">
                            <div class="tool-icon">📊</div>
                            <div class="tool-name">数据分析</div>
                        </div>
                        <div class="tool-card" data-tool="calculator">
                            <div class="tool-icon">🧮</div>
                            <div class="tool-name">计算器</div>
                        </div>
                        <div class="tool-card" data-tool="weather">
                            <div class="tool-icon">🌤️</div>
                            <div class="tool-name">天气查询</div>
                        </div>
                    </div>
                </div>

                <!-- 工具输入区域 -->
                <div id="tool-input-area" style="display: none;">
                    <div class="form-group">
                        <label id="tool-input-label" class="form-label">输入</label>
                        <textarea id="tool-input" class="form-textarea" rows="3"></textarea>
                    </div>
                    <div id="tool-extra-inputs"></div>
                    <button id="tool-execute" class="btn btn-primary">执行</button>
                </div>
                <div id="tool-result" class="result-area"></div>
            </div>

            <!-- 设置标签页 -->
            <div id="settings-tab" class="tab-content">
                <div class="settings-panel">
                    <div class="settings-title">API配置</div>
                    <div class="form-group">
                        <label class="form-label">OpenAI API Key</label>
                        <input type="password" id="openai-key" class="form-input" placeholder="sk-...">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Anthropic API Key</label>
                        <input type="password" id="anthropic-key" class="form-input" placeholder="sk-ant-...">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Google API Key</label>
                        <input type="password" id="google-key" class="form-input" placeholder="AI...">
                    </div>
                    <button id="save-settings" class="btn btn-primary">保存设置</button>
                </div>

                <div class="settings-panel">
                    <div class="settings-title">服务器配置</div>
                    <div class="form-group">
                        <label class="form-label">后端服务器地址</label>
                        <input type="text" id="server-url" class="form-input" value="http://localhost:5000" placeholder="http://localhost:5000">
                    </div>
                    <button id="test-connection" class="btn btn-secondary">测试连接</button>
                </div>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
